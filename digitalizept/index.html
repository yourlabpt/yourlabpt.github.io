<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digitalize Portugal</title>
    <link rel="stylesheet" href="./digitalizept.css">
    <link rel="manifest" href="./manifest.webmanifest">
    <meta name="theme-color" content="#1b1b1b">
    <meta name="robots" content="noindex, nofollow">
</head>
<body>
    <div id="login-overlay" class="overlay">
        <div class="login-box">
            <h1>Digitalize Portugal</h1>
            <p>Introduza a chave para continuar</p>
            <form id="login-form">
                <input type="password" id="key-input" placeholder="Chave" autocomplete="current-password" required>
                <button type="submit">Entrar</button>
            </form>
            <div id="login-error"></div>
            <button id="refreshAppLoginBtn" type="button" class="btn-refresh-login">Recarregar sem cache</button>
        </div>
    </div>

    <div id="app" class="app hidden">
        <header class="app-header">
            <div class="progress">
                <div class="progress-bar"><div id="progressFill" class="progress-fill"></div></div>
                <div class="progress-label">
                    <span id="stepNum">Passo 1 de 10</span>
                    <span class="progress-sep">·</span>
                    <span id="stepName">Tipo de negócio</span>
                </div>
            </div>
            <div class="header-actions">
                <button id="refreshAppBtn" type="button" class="btn-refresh-app" aria-label="Recarregar sem cache" title="Recarregar sem cache">
                    <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
                        <path fill="currentColor" d="M17.65 6.35A7.95 7.95 0 0 0 12 4V1L7 6l5 5V7a6 6 0 1 1-6 6H4a8 8 0 1 0 13.65-6.65z"/>
                    </svg>
                </button>
                <button id="newDealBtn" type="button" class="btn-new-deal" aria-label="Novo negócio">+ Novo</button>
                <a id="admin-link" class="btn-admin" href="./admin.html">Admin</a>
                <button id="logout-btn" type="button" class="btn-logout" aria-label="Sair">Sair</button>
            </div>
        </header>

        <main id="stepContainer" class="app-main"></main>

        <footer class="wizard-nav">
            <button id="backBtn" type="button" class="btn-secondary">Voltar</button>
            <button id="nextBtn" type="button" class="btn-primary">Continuar</button>
        </footer>
    </div>

    <script type="module" src="./js/app.js"></script>
</body>
</html>
