<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" lang="pt">
<head>
<meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="color-scheme" content="light" />
<title>{{heading}} — YourLab Technologies</title>
<style type="text/css">
  body, table, td, a { -webkit-text-size-adjust:100%; -ms-text-size-adjust:100%; }
  table, td { mso-table-lspace:0pt; mso-table-rspace:0pt; }
  body { margin:0 !important; padding:0 !important; width:100% !important; }
  a { color:#1C1C1C; }
  @media screen and (max-width:600px) {
    .container { width:100% !important; }
    .px { padding-left:26px !important; padding-right:26px !important; }
    .wordmark { font-size:34px !important; }
    .tagline { font-size:14px !important; }
    .hook { font-size:20px !important; line-height:32px !important; }
  }
</style>
</head>
<body style="margin:0; padding:0; background-color:#EFEDE9;">

<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#EFEDE9;">
<tr>
<td align="center" style="padding:32px 12px;">

  <table role="presentation" class="container" width="600" cellpadding="0" cellspacing="0" border="0" style="width:600px; max-width:600px; background-color:#FFFFFF; border:1px solid #DCD8D1;">

    <tr>
      <td align="center" style="background-color:#1C1C1C; padding:40px 32px 12px 32px;">
        <div class="wordmark" style="font-family:Georgia,'Times New Roman',serif; font-size:38px; line-height:46px; color:#F2F0EB; letter-spacing:-0.5px;">
          <span style="font-style:italic;">Your</span><span style="font-family:Helvetica,Arial,sans-serif; font-weight:bold; font-style:normal; letter-spacing:-1px;">lab.</span>
        </div>
        <div style="font-family:Helvetica,Arial,sans-serif; font-size:10px; line-height:16px; letter-spacing:5px; color:#8E8B85; padding-top:8px; text-transform:uppercase;">
          Technologies
        </div>
      </td>
    </tr>
    <tr>
      <td align="center" style="background-color:#1C1C1C; padding:0 32px 40px 32px;">
        <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%">
          <tr><td style="border-top:1px solid #3A3A3A; font-size:0; line-height:0; height:1px;">&nbsp;</td></tr>
        </table>
        <div class="tagline" style="font-family:'Courier New',Courier,monospace; font-size:16px; line-height:26px; color:#F2F0EB; padding-top:22px; letter-spacing:1px;">
          ./Digitalize a sua empresa...
        </div>
      </td>
    </tr>

    <tr>
      <td class="px" style="padding:42px 44px 40px 44px;">
        <p class="hook" style="margin:0; font-family:Georgia,'Times New Roman',serif; font-size:23px; line-height:36px; color:#1C1C1C;">
          {{heading}}
        </p>
        <p style="margin:20px 0 0 0; font-family:Helvetica,Arial,sans-serif; font-size:16px; line-height:28px; color:#3A3A3A;">
          {{noticeLine}}
        </p>
      </td>
    </tr>

    <tr>
      <td class="px" style="background-color:#1C1C1C; padding:28px 44px;">
        <div style="font-family:Georgia,'Times New Roman',serif; font-size:18px; line-height:24px; color:#F2F0EB;">
          <span style="font-style:italic;">Your</span><span style="font-family:Helvetica,Arial,sans-serif; font-weight:bold; letter-spacing:-0.5px;">lab.</span>
        </div>
        <p style="margin:12px 0 0 0; font-family:Helvetica,Arial,sans-serif; font-size:11px; line-height:19px; color:#8E8B85;">
          {{empresaNome}} &nbsp;·&nbsp; NIF {{empresaNif}} &nbsp;·&nbsp; {{empresaMoradaLinha}}
        </p>
        <p style="margin:14px 0 0 0; font-family:Helvetica,Arial,sans-serif; font-size:11px; line-height:19px; color:#6E6B66;">
          {{footerNote}}
        </p>
      </td>
    </tr>

  </table>

</td>
</tr>
</table>

</body>
</html>
