<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Demonstração — Digitalize Portugal</title>
    <link rel="stylesheet" href="/digitalizept/digitalizept.css">
</head>
<body>
    <div id="root" class="dp-public">A carregar a demonstração…</div>
    <script type="module">
        import { renderLanding } from '/digitalizept/js/demo/landing.js';
        import { mountHtmlPreview } from '/digitalizept/js/demo/html.js';

        const slug = window.location.pathname.split('/').filter(Boolean).pop();
        const root = document.getElementById('root');

        try {
            const response = await fetch(`/api/digitalizept/public/${encodeURIComponent(slug)}`);
            const data = await response.json();
            if (!response.ok || (!data.demo && !data.demoHtml)) {
                root.textContent = data.error || 'Demonstração não encontrada.';
            } else {
                document.title = `${data.nome || 'Demonstração'} — Digitalize Portugal`;
                if (data.demoHtml && String(data.demoHtml).trim()) {
                    document.body.className = 'dp-public dp-public-html';
                    root.replaceWith((() => {
                        const host = document.createElement('div');
                        host.className = 'dp-public-frame-host';
                        mountHtmlPreview(host, data.demoHtml);
                        return host;
                    })());
                } else {
                    root.replaceWith(renderLanding({
                        data: {
                            businessType: data.businessType,
                            dados: data.dados,
                            identidade: data.identidade,
                            demo: data.demo
                        }
                    }));
                }
            }
        } catch (_) {
            root.textContent = 'Não foi possível carregar a demonstração.';
        }
    </script>
</body>
</html>
