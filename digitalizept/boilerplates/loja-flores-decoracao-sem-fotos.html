<!DOCTYPE html>
<html lang="pt-PT" data-dp-boilerplate="loja-flores-decoracao">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ramos para o dia e para a festa</title>
<meta name="description" content="Flores da estação, eventos e o ramo que se leva de mão.">
<meta property="og:title" content="Ramos para o dia e para a festa">
<meta property="og:description" content="Flores da estação, eventos e o ramo que se leva de mão.">
<meta property="og:type" content="website">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;0,600;1,400;1,600&family=Karla:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/dpl-base.css">
<link rel="stylesheet" href="css/loja-flores-decoracao.css">
</head>
<body>
<header class="dpl-topbar">
    <a class="dpl-topbar-brand" href="#topo" data-dp-copy="nome">A sua florista</a>
    <img class="dpl-topbar-logo" data-dp-logo="" alt="">
    <button class="dpl-nav-toggle" type="button" aria-expanded="false" aria-controls="menu">Menu</button>
    <nav id="menu" class="dpl-nav" aria-label="Secções">
            <a class="dpl-nav-link" href="#topo">Início</a>
            <a class="dpl-nav-link" href="#dpl-servicos">Coleções</a>
            <a class="dpl-nav-link" href="#dpl-sobre">Eventos</a>
            <a class="dpl-nav-link" href="#dpl-contactos">Contactos</a>
            <a class="dpl-btn" href="#dpl-contactos" data-dp-copy="hero.cta" data-dp-href="whatsapp">Encomendar</a>
    </nav>
    
</header>
<main id="topo">
<section class="dpl-hero">
    <div class="dpl-wrap">
        <span class="dpl-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 20c0-6 4-8 4-12a4 4 0 10-8 0c0 4 4 6 4 12z"/><path d="M8 9c-2-1-4 0-4 2"/><path d="M16 9c2-1 4 0 4 2"/></svg></span>
        <h1 data-dp-copy="hero.titulo"></h1>
        <p class="dpl-hero-sub" data-dp-copy="hero.subtitulo"></p>
        <div class="dpl-hero-ctas"><a class="dpl-btn" href="#dpl-contactos" data-dp-copy="hero.cta" data-dp-href="whatsapp"></a></div>
    </div>
</section>
<section class="dpl-section" id="dpl-servicos">
    <div class="dpl-wrap">
        <h2 class="dpl-h2" data-dp-label="servicos">Coleções</h2>
        <ul class="dpl-grid dpl-grid-4" data-dp-list="servicos" style="margin-top:2rem">
            <li class="dpl-season dpl-tile--centered" data-dp-item hidden>
                <span class="dpl-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M5 19c8-1 13-8 14-16-8 1-13 8-14 16z"/><path d="M8 12c3 0 6-3 7-7"/></svg></span>
                <h3 data-dp-copy="servico.nome"></h3>
                <p data-dp-copy="servico.descricao"></p>
            </li>
        </ul>
    </div>
</section>
<section class="dpl-section" id="dpl-sobre">
    <div class="dpl-wrap dpl-grid dpl-grid-2">
        <div>
            <h2 class="dpl-h2" data-dp-label="sobre">O atelier</h2>
            <p>{{sobre}}</p>
            
        </div>
        <div class="dpl-visual dpl-visual-blob" data-dp-photo="0" style="--dp-ratio: 4 / 3" data-fallback-icon="FL"></div>
    </div>
</section>
<section class="dpl-section">
    <div class="dpl-wrap"><ul class="dpl-chips" data-dp-list="destaques">
            <li class="dpl-price-tag" data-dp-item hidden data-dp-copy="destaque.texto"></li>
        </ul><ul class="dpl-chips" data-dp-list="trust">
            <li class="dpl-badge" data-dp-item hidden data-dp-copy="trust.texto"></li>
        </ul></div>
</section>
<section class="dpl-section" id="dpl-avaliacoes">
    <div class="dpl-wrap dpl-grid dpl-grid-2" data-dp-list="avaliacoes">
        <blockquote class="dpl-quote" data-dp-item hidden><p data-dp-copy="avaliacao.texto"></p><footer data-dp-copy="avaliacao.autor"></footer></blockquote>
    </div>
</section>
<section class="dpl-section" id="dpl-contactos">
    <div class="dpl-wrap">
        <div class="dpl-section-head">
            <h2 class="dpl-h2" data-dp-label="contactos">Onde estamos</h2>
            <p class="dpl-lede">{{morada}}, {{cidade}}. <span data-dp-copy="horario">{{horario}}</span></p>
        </div>
        <p><a class="dpl-btn" href="#dpl-contactos" data-dp-href="maps">Encomendar</a></p>
    </div>
</section>
<section class="dpl-cta-band" id="dpl-cta">
    <div class="dpl-wrap">
        <h2 class="dpl-h2">Peça o ramo desta semana</h2>
        <p class="dpl-cta-band-action"><a class="dpl-btn dpl-btn-ghost" href="#dpl-contactos" data-dp-copy="hero.cta" data-dp-href="whatsapp">WhatsApp</a></p>
    </div>
</section>
</main>
<footer class="dpl-rodape">
    <div class="dpl-wrap">
        <strong class="dpl-topbar-brand" data-dp-copy="nome">A sua florista</strong>
        <p>Encomendas até à véspera, quando o mercado deixar.</p>
        <p>{{morada}} · {{cidade}} · <span data-dp-copy="horario">{{horario}}</span></p>
    </div>
</footer>
<script>
(function () {
  var btn = document.querySelector('.dpl-nav-toggle');
  var nav = document.querySelector('.dpl-nav');
  if (!btn || !nav) return;
  btn.addEventListener('click', function () {
    var open = nav.classList.toggle('is-open');
    btn.setAttribute('aria-expanded', open ? 'true' : 'false');
  });
})();
</script>
</body>
</html>
