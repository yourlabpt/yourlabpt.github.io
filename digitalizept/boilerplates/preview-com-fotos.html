<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>Com fotos — Digitalize Portugal</title>
    <link rel="stylesheet" href="/digitalizept/digitalizept.css">
    <style>
        html, body { margin: 0; min-height: 100%; background: #fff; }
    </style>
</head>
<body>
    <p id="status" style="padding: 1.5rem; font-family: system-ui;">A carregar a landing…</p>
    <script type="module">
        import { renderLanding } from '/digitalizept/js/demo/landing.js';
        import { seedDemoFromType } from '/digitalizept/js/demo/seed.js';

        const slug = new URLSearchParams(location.search).get('type') || 'generico';
        const status = document.getElementById('status');
        try {
            const response = await fetch(`/server/config/business-types/${encodeURIComponent(slug)}.json`);
            if (!response.ok) throw new Error('tipo');
            const type = await response.json();
            const seed = type.demo_seed || {};
            const cores = type.cores_sugeridas || ['#1b1b1b', '#e8d5b7', '#7a8a99'];
            const state = {
                data: {
                    businessType: type,
                    dados: {
                        nome_negocio: seed.nome_negocio || type.nome || 'O seu negócio',
                        cidade: seed.cidade || 'Portugal',
                        morada: 'Rua do Comércio',
                        horario: 'Seg–Sáb, 9h–19h'
                    },
                    identidade: {
                        cores: { base: cores[0], destaque: cores[1], secundaria: cores[2] },
                        estilo: 'clean',
                        logo: { tipo: 'nenhum' },
                        fotos: []
                    }
                }
            };
            state.data.demo = seedDemoFromType(state);
            document.title = `${type.nome || slug} — Com fotos`;
            status.replaceWith(renderLanding(state));
        } catch (_) {
            status.textContent = 'Não foi possível carregar esta categoria.';
        }
    </script>
</body>
</html>
