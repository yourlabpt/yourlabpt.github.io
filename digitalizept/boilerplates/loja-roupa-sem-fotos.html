<!DOCTYPE html>
<html lang="pt-PT" data-dp-boilerplate="loja-roupa">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A estação, sem ruído</title>
<meta name="description" content="Peças escolhidas com calma. Feminino, masculino e o essencial de cada estação.">
<meta property="og:title" content="A estação, sem ruído">
<meta property="og:description" content="Peças escolhidas com calma. Feminino, masculino e o essencial de cada estação.">
<meta property="og:type" content="website">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/dpl-base.css">
<link rel="stylesheet" href="css/loja-roupa.css">
</head>
<body>
<header class="dpl-topbar">
    <a class="dpl-topbar-brand" href="#topo" data-dp-copy="nome">A sua loja</a>
    <img class="dpl-topbar-logo" data-dp-logo="" alt="">
    <button class="dpl-nav-toggle" type="button" aria-expanded="false" aria-controls="menu">Menu</button>
    <nav id="menu" class="dpl-nav" aria-label="Secções">
            <a class="dpl-nav-link" href="#topo">Início</a>
            <a class="dpl-nav-link" href="#dpl-servicos">Coleção</a>
            <a class="dpl-nav-link" href="#dpl-sobre">Sobre</a>
            <a class="dpl-nav-link" href="#dpl-contactos">Loja</a>
            
    </nav>
    
</header>
<main id="topo">
<section class="dpl-hero">
    <div class="dpl-wrap">
        
        <p class="dpl-kicker" data-dp-copy="cidade"></p>
        <h1 data-dp-copy="hero.titulo"></h1>
        <p class="dpl-hero-sub" data-dp-copy="hero.subtitulo"></p>
        <div class="dpl-hero-ctas"><a class="dpl-btn" href="#dpl-contactos" data-dp-copy="hero.cta" data-dp-href="whatsapp"></a><a class="dpl-btn dpl-btn-ghost" href="#dpl-contactos" data-dp-href="maps">Visitar loja</a></div>
    </div>
</section>
<section class="dpl-section" id="dpl-servicos">
    <div class="dpl-wrap">
        <h2 class="dpl-h2" data-dp-label="servicos">Coleção</h2>
        <ul class="dpl-grid dpl-grid-4" data-dp-list="servicos" style="margin-top:2rem; gap: 2rem;">
            <li data-dp-item hidden>
                <figure><div class="dpl-visual " data-dp-photo="0" style="--dp-ratio: 3 / 4" data-fallback-icon="RO"></div><figcaption data-dp-copy="servico.nome"></figcaption></figure>
            </li>
        </ul>
    </div>
</section>
<section class="dpl-section" id="dpl-sobre">
    <div class="dpl-wrap">
        <p class="dpl-lede">{{sobre}}</p>
        <p><span class="dpl-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 5a2 2 0 110-4 2 2 0 010 4z"/><path d="M12 5l10 8H2z"/></svg></span> <span class="dpl-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M4 20L20 4"/><path d="M8 16l2 2M12 12l2 2M16 8l2 2"/></svg></span> <span class="dpl-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M6 8h12l-1 13H7z"/><path d="M9 8V6a3 3 0 016 0v2"/></svg></span></p>
    </div>
</section>
<section class="dpl-look">
    <div class="dpl-wrap"><ul class="dpl-grid dpl-grid-3" data-dp-list="diferenciais">
            <li data-dp-item hidden><span class="dpl-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M5 13l4 4L19 7"/></svg></span><p data-dp-copy="diferencial.texto"></p></li>
        </ul></div>
</section>
<section class="dpl-section dpl-section--muted" id="dpl-contactos">
    <div class="dpl-wrap">
        <div class="dpl-section-head">
            <h2 class="dpl-h2" data-dp-label="contactos">Onde estamos</h2>
            <p class="dpl-lede">{{morada}}, {{cidade}}. <span data-dp-copy="horario">{{horario}}</span></p>
        </div>
        <p><a class="dpl-btn" href="#dpl-contactos" data-dp-href="maps">Visitar a loja</a></p>
    </div>
</section>
<section class="dpl-cta-band" id="dpl-cta">
    <div class="dpl-wrap">
        <h2 class="dpl-h2">Passe pela loja</h2>
        <p class="dpl-cta-band-action"><a class="dpl-btn dpl-btn-ghost" href="#dpl-contactos" data-dp-copy="hero.cta" data-dp-href="maps">Como chegar</a></p>
    </div>
</section>
</main>
<footer class="dpl-rodape">
    <div class="dpl-wrap">
        <strong class="dpl-topbar-brand" data-dp-copy="nome">A sua loja</strong>
        <p>Horário de rua — confirme feriados.</p>
        <p>{{morada}} · {{cidade}} · <span data-dp-copy="horario">{{horario}}</span></p>
    </div>
</footer>
<script>
(function () {
  var btn = document.querySelector('.dpl-nav-toggle');
  var nav = document.querySelector('.dpl-nav');
  if (!btn || !nav) return;
  btn.addEventListener('click', function () {
    var open = nav.classList.toggle('is-open');
    btn.setAttribute('aria-expanded', open ? 'true' : 'false');
  });
})();
</script>
</body>
</html>
